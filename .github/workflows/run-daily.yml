name: VktoTG

on:
  workflow_dispatch:      # позволяет запустить вручную из вкладки Actions
# push:
  schedule:
    - cron: '*/5 * * * *'

# не даём двум запускам работать одновременно, если предыдущий ещё не завершился
concurrency:
  group: vktotg
  cancel-in-progress: false

env:
  VK_TOKEN: ${{ secrets.VK_TOKEN }}
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}

jobs:
  VktoTGBot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run App (single check)
        run: python vk_chat_to_tg.py

      - name: Save state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_ts.json
          git diff --staged --quiet || git commit -m "Update last forwarded message id [skip ci]"
          git push
