      - name: Checkout Code
        uses: actions/checkout@v4

      # Добавляем этот шаг, чтобы явно изолировать среду Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run App
        run: python vk_chat_to_tg.py
